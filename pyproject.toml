[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aps-hazop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "cryptography>=46,<47"]
[project.optional-dependencies]
telemetry = ["opentelemetry-api==1.45.1", "opentelemetry-sdk==1.38.0"]
test = ["hypothesis>=6,<7"]
[project.scripts]
aps = "aps.cli:main"
aps-governance = "aps_governance.cli:main"
[tool.setuptools.packages.find]
where = ["packages/engine", "packages/governance"]
