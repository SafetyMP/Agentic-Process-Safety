name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    name: Readiness and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6; existing deployment pin
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node scripts/verify-repository-readiness.mjs
      - run: node --test scripts/verify-repository-readiness.test.mjs
      - run: npm ci
      # The root simulator tests invoke the Python governance gateway.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - name: Install pinned OPA for simulator gateway tests
        run: |
          mkdir -p .harness/ci-bin
          curl --fail --silent --show-error --location https://github.com/open-policy-agent/opa/releases/download/v1.21.4/opa_linux_amd64_static --output .harness/ci-bin/opa
          echo '2ab571f367f293bb19523b76f92f1945bbf245003392c7f392903f95c2b9b630  .harness/ci-bin/opa' | sha256sum --check
          chmod +x .harness/ci-bin/opa
          echo "$GITHUB_WORKSPACE/.harness/ci-bin" >> "$GITHUB_PATH"
      - run: npm test
      - run: npm run typecheck
      - run: npm run demo:fixtures:check
      - run: npm run demo:production:check
      - run: npm run demo:lint
      - run: npm run demo:typecheck
      - run: npm run demo:test
      - run: npm run demo:build
      - run: npm run demo:static:check
      # These steps observe only the reviewed same-repository release PR. They cannot deploy.
      - name: Bind predeployment QA to built source
        if: &release-pr >-
          github.event_name == 'pull_request' && github.repository_id == '1430231911' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'release/aps-github-validation-v1'
        run: node apps/aps-demo/scripts/qa-evidence.mjs
      - name: Record actual PR checkout and workflow identities
        id: validation
        if: *release-pr
        run: node apps/aps-demo/scripts/validation-evidence.mjs prepare
      - name: Install pinned Chromium shell for release PR
        if: *release-pr
        run: mkdir -p .harness/tmp && npx playwright install --with-deps chromium --only-shell
        env:
          PLAYWRIGHT_BROWSERS_PATH: .harness/playwright
          TMPDIR: ${{ github.workspace }}/.harness/tmp
      - name: Test predeployment and postdeployment rejection cases
        if: *release-pr
        run: node --test scripts/verify-linux-predeploy-evidence.test.mjs scripts/verify-linux-ci-evidence.test.mjs
      - name: Validate built release PR in Chromium
        if: *release-pr
        run: npm run demo:e2e
        env:
          APS_BROWSER: chromium
      - name: Finalize predeployment observations even after failure
        if: >-
          always() && github.event_name == 'pull_request' && github.repository_id == '1430231911' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'release/aps-github-validation-v1'
        run: node apps/aps-demo/scripts/validation-evidence.mjs finalize
      - name: Retain predeployment evidence including failed runs
        if: >-
          always() && github.event_name == 'pull_request' && github.repository_id == '1430231911' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'release/aps-github-validation-v1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; ordinary artifact only
        with:
          name: aps-predeploy-${{ steps.validation.outputs.checkout_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .harness/ci-qa/identity.json
            .harness/ci-qa/browser-result.json
            .harness/ci-qa/validation.json
            docs/screenshots/overview.jpg
            docs/screenshots/hazop.jpg
            docs/screenshots/governance.jpg
            docs/screenshots/simulator.jpg
            docs/screenshots/assurance.jpg
            docs/screenshots/mobile-light.jpg
            docs/screenshots/mobile-dark.jpg
            apps/aps-demo/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  python:
    name: Python engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu supplies Python 3.12. OPA/Phase 3 remain separate local gates.
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock
      - run: .venv/bin/python -m unittest discover -s tests -p test_engine.py -v
        env:
          PYTHONPATH: packages/engine:packages/governance
